[package]
name = "hush-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray"] }

[dev-dependencies]
tempfile = "3"
