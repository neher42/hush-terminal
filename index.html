<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hush</title>
  </head>
  <body>
    <div class="app" id="app">
      <header class="titlebar" data-tauri-drag-region>
        <button class="icon-button" id="toggle-sidebar" type="button" aria-label="Toggle directory tree" data-tip="Toggle tree  ⌘B"></button>
        <div class="tabs" id="tabs" data-tauri-drag-region></div>
        <button class="icon-button" id="new-tab" type="button" aria-label="New tab" data-tip="New tab  ⌘T"></button>
        <button class="icon-button" id="copy-cwd" type="button" aria-label="Copy current path" data-tip="Copy current path  ⌘⇧C"></button>
      </header>
      <div class="main">
        <aside class="sidebar" id="sidebar" aria-label="Directory tree"></aside>
        <section class="terminal-pane" id="terminal-pane"></section>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
