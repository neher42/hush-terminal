name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches the app version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' hush-gpui/Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match hush-gpui version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build Hush.app and the disk image
        run: |
          hush-gpui/bundle.sh
          # A bundle whose signature doesn't cover its files shows up as "damaged".
          codesign --verify --deep --strict --verbose=2 target/release/bundle/Hush.app
          hdiutil create -volname Hush -srcfolder target/release/bundle/Hush.app \
            -ov -format UDZO "Hush-$GITHUB_REF_NAME.dmg"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Hush-$GITHUB_REF_NAME.dmg" \
            --title "$GITHUB_REF_NAME" --notes-file - <<'NOTES'
          Apple Silicon (M1 or newer) only.

          The app isn't notarized, so macOS blocks it on first launch. After moving Hush to Applications, either click "Open Anyway" in System Settings → Privacy & Security, or run:

          ```
          xattr -dr com.apple.quarantine /Applications/Hush.app
          ```
          NOTES
